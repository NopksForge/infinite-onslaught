info:
  name: delete all
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/craft"
  headers:
    - name: X-Reference-Id
      value: "{{randRefID}}"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');

        const uuid = uuidv4();
        bru.setVar("randRefID", uuid);
    - type: after-response
      code: |-
        // Test
        test("Status code is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
